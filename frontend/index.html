<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OdontoPlatform</title>
    <script>
      // Aplica a classe .dark no <html> ANTES do primeiro paint — evita FOUC (flash de tema
      // errado) quando o usuário está em dark mode. Chave/formato têm que casar exatamente com
      // frontend/src/lib/theme-store.ts (string crua, não JSON do zustand/persist).
      (function () {
        try {
          var stored = localStorage.getItem('odonto-theme');
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
